<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Plotter Geometry Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eceee9;
        --panel: #f7f8f5;
        --panel-2: #eef0ea;
        --ink: #1c1f22;
        --muted: #5d6570;
        --faint: #8a929c;
        --line: #d3d7cf;
        --line-strong: #b9beb2;
        --accent: #2d4e9e;
        --accent-ink: #ffffff;
        --accent-soft: rgba(45, 78, 158, 0.10);
        --warn: #b3541e;
        --paper: #ffffff;
        --stage-dot: rgba(28, 31, 34, 0.10);
        --shadow: 0 10px 34px rgba(24, 28, 32, 0.16), 0 2px 8px rgba(24, 28, 32, 0.10);
        --radius: 10px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101215;
          --panel: #17191d;
          --panel-2: #1e2126;
          --ink: #e8eae6;
          --muted: #a3abb4;
          --faint: #767e88;
          --line: #2c3036;
          --line-strong: #3d434b;
          --accent: #8fb0ff;
          --accent-ink: #10131c;
          --accent-soft: rgba(143, 176, 255, 0.13);
          --warn: #e08a4e;
          --stage-dot: rgba(232, 234, 230, 0.09);
          --shadow: 0 10px 34px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.4);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
        font-size: 15px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      button, select, input { font: inherit; color: inherit; }
      button, select, input[type="range"], input[type="number"] { min-height: 2.25rem; }
      a { color: var(--accent); }

      .app {
        display: grid;
        grid-template-columns: 348px minmax(0, 1fr);
        min-height: 100vh;
      }

      /* ---------- control panel ---------- */
      .panel {
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 18px 18px 28px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .panel h2 {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 10px;
      }
      .panel section { margin: 0; }

      .pattern-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .pattern-btn {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--panel-2);
        border-radius: 8px;
        padding: 8px 10px;
        text-align: left;
        cursor: pointer;
        font-size: 13.5px;
        font-weight: 500;
        line-height: 1.25;
        min-height: 2.5rem;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .pattern-btn:hover { border-color: var(--line-strong); }
      .pattern-btn.active {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--ink);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .pattern-btn .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--faint); flex: none;
      }
      .pattern-btn.active .dot { background: var(--accent); }
      .pattern-btn.wide { grid-column: 1 / -1; }

      .param { margin-bottom: 13px; }
      .param-head {
        display: flex; justify-content: space-between; align-items: baseline;
        gap: 10px; margin-bottom: 3px;
      }
      .param-head label { font-size: 13.5px; font-weight: 500; }
      .param-val {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12.5px; color: var(--muted); white-space: nowrap;
      }
      .param input[type="range"] {
        width: 100%; margin: 0; padding: 0;
        accent-color: var(--accent); min-height: 1.6rem; cursor: pointer;
      }
      .param select {
        width: 100%; padding: 6px 8px;
        background: var(--panel-2); border: 1px solid var(--line);
        border-radius: 7px; cursor: pointer;
      }
      .param-check { display: flex; align-items: center; gap: 9px; min-height: 2.25rem; cursor: pointer; }
      .param-check input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
      .param-check span { font-size: 13.5px; font-weight: 500; }
      .param-note { font-size: 12px; color: var(--muted); margin-top: 2px; }

      .pen-slots { display: flex; flex-direction: column; gap: 14px; }
      .pen-slot { display: flex; flex-direction: column; gap: 6px; }
      .pen-slot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
      .pen-slot-head .slot-label { font-size: 13px; font-weight: 500; }
      .pen-picker { display: grid; grid-template-columns: repeat(8, 26px); gap: 6px; }
      .pen-chip {
        width: 26px; height: 26px; border-radius: 50%;
        border: 2px solid transparent;
        padding: 0; cursor: pointer; flex: none;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18);
        min-height: 26px;
      }
      .pen-chip.selected { border-color: var(--ink); transform: scale(1.08); }
      .pen-name {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px; color: var(--muted);
      }

      .pen-toggles-title { font-size: 13.5px; font-weight: 500; margin-top: 14px; }
      .pen-toggles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      .pen-toggle {
        appearance: none; display: inline-flex; align-items: center; gap: 6px;
        border: 1px solid var(--line-strong); background: var(--panel-2);
        border-radius: 999px; padding: 4px 10px 4px 5px; cursor: pointer;
        font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px;
        line-height: 1.2; min-height: 2rem; color: var(--ink);
      }
      .pen-toggle:hover { border-color: var(--faint); }
      .pen-toggle i {
        width: 13px; height: 13px; border-radius: 50%; display: block; flex: none;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2);
      }
      .pen-toggle.off { opacity: 0.45; border-style: dashed; }
      .pen-toggle.off i { filter: grayscale(0.45); }
      .pen-toggle.off .pen-toggle-text { text-decoration: line-through; }
      .pen-toggle-hint { font-size: 12px; color: var(--warn); margin-top: 6px; }
      .pen-toggle-hint:empty { display: none; }

      .seed-row { display: flex; gap: 8px; align-items: stretch; }
      .seed-row input[type="number"] {
        width: 110px; padding: 6px 9px;
        background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px;
        font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px;
      }
      .btn {
        appearance: none; border: 1px solid var(--line-strong);
        background: var(--panel-2); color: var(--ink);
        border-radius: 8px; padding: 7px 14px; cursor: pointer;
        font-weight: 500; font-size: 13.5px; min-height: 2.5rem;
      }
      .btn:hover { border-color: var(--faint); }
      .btn.primary {
        background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
        font-weight: 600;
      }
      .btn.primary:hover { filter: brightness(1.08); }
      .btn:disabled { opacity: 0.55; cursor: wait; }
      .btn.small { min-height: 2.25rem; padding: 5px 11px; font-size: 13px; }

      .desc {
        font-size: 13px; color: var(--muted); line-height: 1.55;
        border-top: 1px solid var(--line); padding-top: 14px;
      }
      .desc strong { color: var(--ink); font-weight: 600; }
      .desc p { margin: 0 0 8px; }
      .desc p:last-child { margin-bottom: 0; }

      /* ---------- stage ---------- */
      .stage {
        padding: 20px 22px 30px;
        display: flex; flex-direction: column; gap: 16px;
        background-image: radial-gradient(var(--stage-dot) 1px, transparent 1.1px);
        background-size: 22px 22px;
        min-width: 0;
      }
      .stats {
        display: flex; flex-wrap: wrap; gap: 10px 26px;
        background: var(--panel); border: 1px solid var(--line);
        border-radius: var(--radius); padding: 12px 18px;
        align-items: baseline;
      }
      .stat { display: flex; flex-direction: column; }
      .stat .v {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 21px; font-weight: 600; line-height: 1.15;
      }
      .stat .v small { font-size: 12.5px; font-weight: 500; color: var(--muted); }
      .stat .k { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
      .stat.warn .v { color: var(--warn); }
      .stats .spacer { flex: 1; }
      .pen-breakdown { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
      .pen-tag {
        display: inline-flex; align-items: center; gap: 6px;
        font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px;
        border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px 3px 5px;
        color: var(--muted); background: var(--panel-2);
      }
      .pen-tag i { width: 11px; height: 11px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2); }

      .paper-wrap { display: flex; justify-content: center; padding: 6px 0 2px; }
      .paper {
        background: var(--paper);
        box-shadow: var(--shadow);
        border-radius: 3px;
        width: min(100%, 520px);
        aspect-ratio: 118 / 140;
        position: relative;
      }
      .paper svg { display: block; width: 100%; height: auto; }
      .paper-msg {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        text-align: center; padding: 20px;
        font-size: 13.5px; color: #8a929c; pointer-events: none;
      }
      .paper-msg[hidden] { display: none; }
      .paper .bedlabel {
        position: absolute; right: 8px; bottom: 6px;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 10.5px; color: #9aa0a6; pointer-events: none;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; justify-content: center; }
      .actions .hint { font-size: 12.5px; color: var(--muted); width: 100%; text-align: center; }
      .status-line {
        text-align: center; font-size: 13px; color: var(--muted); min-height: 1.2em;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
      }
      .status-line.error { color: var(--warn); }

      @media (max-width: 860px) {
        .app { grid-template-columns: 1fr; }
        .panel { border-right: none; border-top: 1px solid var(--line); order: 2; }
        .stage { order: 1; padding: 14px 12px 20px; }
        .pattern-grid { grid-template-columns: 1fr 1fr 1fr; }
        .pattern-btn { font-size: 12.5px; padding: 7px 8px; }
        .stat .v { font-size: 18px; }
      }
      @media (max-width: 480px) {
        .pattern-grid { grid-template-columns: 1fr 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <section>
          <h2>Pattern</h2>
          <div class="pattern-grid" id="patternGrid"></div>
        </section>

        <section>
          <h2 id="paramsTitle">Parameters</h2>
          <div id="paramsBox"></div>
        </section>

        <section>
          <h2>Pens</h2>
          <div class="pen-slots" id="penSlots"></div>
        </section>

        <section>
          <h2>Colour mode</h2>
          <div id="colourBox"></div>
        </section>

        <section>
          <h2>Seed</h2>
          <div class="seed-row">
            <input type="number" id="seedInput" value="7" min="0" max="999999" step="1" aria-label="Random seed" />
            <button class="btn" id="seedDice" type="button">Randomise</button>
          </div>
        </section>

        <section>
          <h2>Output</h2>
          <div id="outputBox"></div>
        </section>

        <div class="desc" id="descBox"></div>
      </aside>

      <main class="stage">
        <div class="stats" id="statsBox"></div>
        <div class="paper-wrap">
          <div class="paper">
            <svg id="preview" viewBox="0 0 118 140" preserveAspectRatio="xMidYMid meet" aria-label="Pattern preview at bed scale"></svg>
            <div class="paper-msg" id="paperMsg">Generating preview…</div>
            <div class="bedlabel">118 × 140 mm</div>
          </div>
        </div>
        <div class="status-line" id="statusLine"></div>
        <div class="actions">
          <button class="btn primary" id="downloadBtn" type="button">Download SVG</button>
          <button class="btn" id="copyBtn" type="button">Copy SVG</button>
          <button class="btn" id="playBtn" type="button">▶ Preview plot</button>
          <span class="hint" id="exportHint"></span>
        </div>
      </main>
    </div>

    <script>
    "use strict";
    /* ================================================================
       Plotter Geometry Generator
       Bed: 118 x 140 mm, stroke-only, 8 BIC pens (T0-T7).
       All geometry is generated in millimetres, origin top-left.
       ================================================================ */
    var BED_W = 118, BED_H = 140;
    var PEN_WIDTH = 0.32; // BIC Cristal 1.0mm ball -> 0.32mm line

    // The user's actual 8 BIC pens, colours sampled from the caps (T0-T7).
    var PENS = [
      { t: "T0", name: "Black",     hex: "#2c2d30" },
      { t: "T1", name: "Red",       hex: "#e42e2a" },
      { t: "T2", name: "Pink",      hex: "#c65a93" },
      { t: "T3", name: "Sky Blue",  hex: "#08b1dc" },
      { t: "T4", name: "Lime",      hex: "#7bae44" },
      { t: "T5", name: "Turquoise", hex: "#0497bd" },
      { t: "T6", name: "Blue",      hex: "#2d4e9e" },
      { t: "T7", name: "Violet",    hex: "#533c94" }
    ];

    /* ---------------- seeded RNG ---------------- */
    function mulberry32(seed) {
      var a = seed >>> 0;
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        var t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function shuffle(arr, rand) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = (rand() * (i + 1)) | 0, t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }
    function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a || 1; }
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }

    /* ---------------- Perlin noise + fBm ---------------- */
    function makeNoise2D(seed) {
      var rand = mulberry32(seed * 7919 + 13);
      var p = new Uint8Array(256), i;
      for (i = 0; i < 256; i++) p[i] = i;
      for (i = 255; i > 0; i--) { var j = (rand() * (i + 1)) | 0, t = p[i]; p[i] = p[j]; p[j] = t; }
      var perm = new Uint8Array(512);
      for (i = 0; i < 512; i++) perm[i] = p[i & 255];
      function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
      function grad(h, x, y) {
        switch (h & 7) {
          case 0: return x + y; case 1: return x - y; case 2: return -x + y; case 3: return -x - y;
          case 4: return x; case 5: return -x; case 6: return y; default: return -y;
        }
      }
      // returns roughly [-1, 1]
      return function (x, y) {
        var X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
        x -= Math.floor(x); y -= Math.floor(y);
        var u = fade(x), v = fade(y);
        var a = perm[X] + Y, b = perm[X + 1] + Y;
        return lerp(
          lerp(grad(perm[a], x, y), grad(perm[b], x - 1, y), u),
          lerp(grad(perm[a + 1], x, y - 1), grad(perm[b + 1], x - 1, y - 1), u), v) * 1.42;
      };
    }
    function makeFbm(seed, octaves) {
      var noise = makeNoise2D(seed);
      return function (x, y) {
        var sum = 0, amp = 0.5, tot = 0, fx = x, fy = y;
        for (var o = 0; o < octaves; o++) {
          sum += amp * noise(fx, fy); tot += amp;
          fx *= 2.03; fy *= 1.97; amp *= 0.5;
        }
        return sum / tot; // [-1, 1]
      };
    }

    /* ---------------- stroke helpers ----------------
       A stroke: { pen: 0..7, pts: [[x,y],...], closed: bool }       */
    function strokeLen(pts) {
      var L = 0;
      for (var i = 1; i < pts.length; i++) {
        var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
        L += Math.sqrt(dx * dx + dy * dy);
      }
      return L;
    }
    function strokeBBox(strokes) {
      var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      strokes.forEach(function (s) {
        s.pts.forEach(function (p) {
          if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
          if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
        });
      });
      return { x0: x0, y0: y0, x1: x1, y1: y1, w: x1 - x0, h: y1 - y0 };
    }
    // Uniformly scale + centre a set of strokes into the bed minus margin.
    function fitStrokes(strokes, margin, cx, cy) {
      if (!strokes.length) return strokes;
      var bb = strokeBBox(strokes);
      if (bb.w <= 0 && bb.h <= 0) return strokes;
      var tw = BED_W - margin * 2, th = BED_H - margin * 2;
      var sc = Math.min(tw / Math.max(bb.w, 1e-6), th / Math.max(bb.h, 1e-6));
      var ox = (cx === undefined ? BED_W / 2 : cx), oy = (cy === undefined ? BED_H / 2 : cy);
      var mx = (bb.x0 + bb.x1) / 2, my = (bb.y0 + bb.y1) / 2;
      strokes.forEach(function (s) {
        s.pts = s.pts.map(function (p) { return [ox + (p[0] - mx) * sc, oy + (p[1] - my) * sc]; });
      });
      return strokes;
    }
    // Fit preserving aspect but filling both axes when the art is bed-shaped.
    function scaleStrokes(strokes, sx, sy, ox, oy) {
      strokes.forEach(function (s) {
        s.pts = s.pts.map(function (p) { return [p[0] * sx + ox, p[1] * sy + oy]; });
      });
      return strokes;
    }

    function clipSegmentRect(x0, y0, x1, y1) {
      // Liang-Barsky against bed rect; returns [x0,y0,x1,y1] or null
      var dx = x1 - x0, dy = y1 - y0, t0 = 0, t1 = 1;
      var p = [-dx, dx, -dy, dy], q = [x0, BED_W - x0, y0, BED_H - y0];
      for (var i = 0; i < 4; i++) {
        if (p[i] === 0) { if (q[i] < 0) return null; }
        else {
          var t = q[i] / p[i];
          if (p[i] < 0) { if (t > t1) return null; if (t > t0) t0 = t; }
          else { if (t < t0) return null; if (t < t1) t1 = t; }
        }
      }
      return [x0 + t0 * dx, y0 + t0 * dy, x0 + t1 * dx, y0 + t1 * dy];
    }
    function clipStrokeToBed(pts, closed) {
      // Split a polyline at the bed boundary. Returns array of point-arrays.
      var out = [], cur = null;
      function push(p) { if (!cur) { cur = [p]; out.push(cur); } else cur.push(p); }
      var n = pts.length, segs = closed ? n : n - 1;
      for (var i = 0; i < segs; i++) {
        var a = pts[i], b = pts[(i + 1) % n];
        var c = clipSegmentRect(a[0], a[1], b[0], b[1]);
        if (!c) { cur = null; continue; }
        var p0 = [c[0], c[1]], p1 = [c[2], c[3]];
        if (cur && cur.length) {
          var last = cur[cur.length - 1];
          if (Math.abs(last[0] - p0[0]) > 1e-6 || Math.abs(last[1] - p0[1]) > 1e-6) cur = null;
        }
        if (!cur) push(p0);
        push(p1);
      }
      return out.filter(function (s) { return s.length > 1; });
    }
    function clipAll(strokes) {
      var out = [];
      strokes.forEach(function (s) {
        clipStrokeToBed(s.pts, s.closed).forEach(function (pts) {
          out.push({ pen: s.pen, pts: pts, closed: false });
        });
      });
      return out;
    }

    /* Douglas-Peucker simplification (iterative) */
    function simplifyPts(pts, tol) {
      if (pts.length < 3 || tol <= 0) return pts;
      var keep = new Uint8Array(pts.length);
      keep[0] = keep[pts.length - 1] = 1;
      var stack = [[0, pts.length - 1]];
      while (stack.length) {
        var seg = stack.pop(), a = seg[0], b = seg[1];
        var ax = pts[a][0], ay = pts[a][1], bx = pts[b][0], by = pts[b][1];
        var dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
        var maxD = 0, idx = -1;
        for (var i = a + 1; i < b; i++) {
          var px = pts[i][0] - ax, py = pts[i][1] - ay;
          var d = len2 === 0 ? Math.sqrt(px * px + py * py)
            : Math.abs(px * dy - py * dx) / Math.sqrt(len2);
          if (d > maxD) { maxD = d; idx = i; }
        }
        if (maxD > tol && idx > 0) { keep[idx] = 1; stack.push([a, idx], [idx, b]); }
      }
      var out = [];
      for (var k = 0; k < pts.length; k++) if (keep[k]) out.push(pts[k]);

    /* ---------- 3D surfaces with z-buffer hidden-line removal ---------- */

    /* ---------- variable-density hatch shading (darkness-field line placement) ---------- */

    /* ---------- Voronoi (half-plane clipping) + Lloyd relaxation ---------- */
    function voronoiStrokes(P, pen, penDelaunay, ctx) {

      {

        desc: "<p><strong>Evenly-spaced streamlines</strong> through a noise angle field — the Fidenza family. Lines are seeded on a grid and grown in both directions, stopping before they crowd an existing line (Jobard &amp; Lefer's method), which keeps ink even and lifts low. Angle = noise × 2π × multiplier, after Tyler Hobbs. Curl mode uses Bridson's curl noise — divergence-free, so lines swirl in eddies instead of piling into gutters.</p><p>Sources: <a href=\"https://www.tylerxhobbs.com/words/flow-fields?format=amp\" target=\"_blank\" rel=\"noopener\">Hobbs, Flow Fields</a> · <a href=\"https://www.plotcaster.com/learn/flow-field-art-from-photos/\" target=\"_blank\" rel=\"noopener\">Plotcaster flow guide</a></p>",

      {

      {
        id: "hankin", name: "Hankin Stars",

        id: "lsystem", name: "L-Systems",

      {
        id: "maze", name: "Maze",
        desc: "<p><strong>Every perfect maze is a spanning tree</strong> — exactly cells−1 passages. The backtracker grows long twisty corridors with few dead ends; Prim's is branchy with many short dead ends; Kruskal's spreads them evenly. Braiding opens loops at dead ends. The solution path is found by BFS and drawn in its own pen. Collinear wall runs are merged before export, so walls plot as long strokes, not cell-by-cell segments.</p><p>Source: <a href=\"https://www.puzzlemakeronline.com/maze-generation-algorithms/\" target=\"_blank\" rel=\"noopener\">Maze generation algorithms compared</a></p>",

        id: "surface3d", name: "3D Surface",
        desc: "<p><strong>Parametric surfaces with true hidden-line removal:</strong> the surface is triangulated into a z-buffer, then each wireframe line is kept only where it is actually visible — the same approach as fogleman's <em>ln</em> engine. That's what makes a torus or a coiled shell read as a solid shaded object instead of a tangle. Turn HLR off for the full transparent wireframe.</p><p>Source: <a href=\"https://reindernijhoff.net/2019/01/3d-line-art-engine-port/\" target=\"_blank\" rel=\"noopener\">Reinder Nijhoff, 3D line art engine (ln port)</a></p>",

      {

        desc: "<p><strong>Tone from line spacing, never from fill.</strong> The generator walks across the shape accumulating a darkness field, and places a line each time the integral crosses one spacing unit — so lines pack tight in the shadows and spread out in the lights. For a 0.32 mm BIC line, ~0.4 mm spacing reads as solid dark and lines merge below ~0.55 mm. The tone curve (gamma) lifts the mid-tones, which helps because ink spreads on paper and plots come out darker than the preview.</p><p>Source: <a href=\"https://github.com/algonormative/hatch3d/blob/HEAD/docs/techniques/hatching.md\" target=\"_blank\" rel=\"noopener\">hatch3d, hatching techniques</a></p>",

      {
        id: "rd", name: "Reaction–Diffusion",
        desc: "<p><strong>Gray–Scott reaction–diffusion, converted to contour bands.</strong> Two chemicals diffuse and react (U + 2V → 3V); V must diffuse at half U's rate or no pattern forms. The simulation itself is a pixel field, so what plots is marching-squares contours of the V field — spots, dividing cells and coral as nested line loops. Presets use Karl Sims's canonical (f, k) values; other published values differ enough to change regime, so treat the free sliders as exploratory.</p><p>Source: <a href=\"https://karlsims.com/rd.html\" target=\"_blank\" rel=\"noopener\">Karl Sims, Reaction-Diffusion</a></p>",

    /* ================================================================

       the preview and the export all describe the real multicolour
       output, including the extra lifts where a line changes pen.
       ================================================================ */
    var COLOUR_MODES = [
      ["single", "Single — pen slots above"],
      ["direction", "By direction — stroke angle"],
      ["position", "By position — gradient across the sheet"],
      ["order", "By order — along the drawing"],
      ["size", "By size — feature size"],
      ["rainbow", "Rainbow — cycle all 8 pens"],
      ["random", "Random — seeded, per stroke"]

      spacefill: "order", maze: "order", packing: "size", moire: "single",
      contours: "order", surface3d: "direction", hatch: "position", rd: "order",
      voronoi: "size"
    };
    var COLOUR_NOTES = {
      speedrun: "Runs across all three families in draw order.",
      flow: "Each streamline takes the pen for its mean direction.",
      spiral: "By order splits the single line into coloured segments — each segment is its own path, so the pen changes are real.",
      harmonograph: "By order splits the single line into coloured segments — each segment is its own path, so the pen changes are real.",
      spiro: "By order splits the closed roulette into coloured segments around the curve.",
      truchet: "By size colours each joined strap by its length.",
      hankin: "By size colours straps by their tile — octagon straps vs square straps; By position shades across the sheet.",
      lsystem: "By order follows the turtle's traversal from first segment to last.",
      spacefill: "By order splits the one unbroken line into coloured segments along its length.",
      maze: "Walls always keep the wall pen — the mode colours the solution path only.",
      packing: "By size colours each circle (and its inner ring) by radius.",
      moire: "Single keeps the two gratings on their own pens — that colour separation is the effect. Other modes recolour both gratings together.",
      contours: "By order runs through the contour levels in the order they are drawn, low to high.",
      surface3d: "By direction separates the u-line and v-line families; By position colours by depth, front darkest.",
      hatch: "Hatch lines are coloured by tone band — each darkness level gets its own pen, lightest sky blue to darkest black.",
      rd: "By order runs through the contour bands in the order they are drawn.",
      voronoi: "By size colours each edge by the area of the cell it borders."
    };
    // Palette walks through the 8 BIC pens.
    var GRADIENT_PENS = [0, 6, 5, 3, 4, 1, 2, 7]; // black → blue → turquoise → sky → lime → red → pink → violet
    var WHEEL_PENS = [1, 4, 5, 3, 6, 7, 2, 0];    // hue wheel for direction
    var TONE_PENS = [3, 4, 5, 6, 2, 7, 1, 0];     // light → dark, for tone bands and depth

    var OUTPUT_PARAMS = {
      margin: R("Margin", 2, 18, 0.5, 6, "mm"),
      simplify: R("Simplify tolerance", 0, 0.2, 0.01, 0.02, "mm"),
      join: CHK("Join touching paths (linemerge)", true),
      joinTol: R("Join tolerance", 0.05, 1, 0.05, 0.3, "mm"),
      sort: CHK("Sort paths (nearest neighbour)", true),
      travel: CHK("Show pen-up travel in preview", false),
      pause: CHK("Pause before each pen layer (!)", false),
      feed: R("Pen-down speed (for time estimate)", 10, 150, 5, 50, "mm/s")
    };
    OUTPUT_PARAMS.margin.note = "Fitted patterns scale into this margin. Flow fields stop at it; tilings, moiré, contours and wave hatch run edge-to-edge by design.";

    /* ================================================================
       STATE + UI
       ================================================================ */
    var state = {
      pattern: "speedrun",
      seed: 7,
      values: {},   // per pattern id: {paramKey: value}
      pens: {},     // per pattern id: [penIdx,...]
      colour: {},   // per pattern id: colour mode key
      penEnabled: [true, true, true, true, true, true, true, true], // global: applies to every pattern, survives pattern switches
      output: {}
    };

      });
      var feed = state.output.feed;
      var seconds = ink / feed + travel / 200 + lifts * 0.5;
      return { paths: strokes.length, ink: ink, travel: travel, lifts: lifts, seconds: seconds, perPen: perPen };
    }

    /* ---------------- preview ---------------- */
    function fmtPt(p) { return (Math.round(p[0] * 100) / 100) + " " + (Math.round(p[1] * 100) / 100); }
    function pathD(pts, closed) {
      var d = "M" + fmtPt(pts[0]);
      for (var i = 1; i < pts.length; i++) d += "L" + fmtPt(pts[i]);
      if (closed) d += "Z";
      return d;
    }
    /* Preview is built with createElementNS, not svg.innerHTML: string
       injection into an SVG element is the one step that can silently
       yield an empty sheet in some webviews. The preview also draws at
       0.45 mm instead of the true 0.32 mm pen width — at phone size the
       real width is ~1 px and fine lines (esp. light pens) drop out.
       Exported SVGs keep the exact 0.32 mm. */
    var SVGNS = "http://www.w3.org/2000/svg";
    var PREVIEW_PEN_WIDTH = 0.45;
    function svgEl(tag, attrs) {
      var n = document.createElementNS(SVGNS, tag);
      Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
      return n;
    }
    function renderPreview() {
      if (anim) stopAnim();
      var svg = el("preview");
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      svg.appendChild(svgEl("rect", { x: 0, y: 0, width: BED_W, height: BED_H, fill: "#ffffff" }));
      var m = state.output.margin;
      svg.appendChild(svgEl("rect", { x: m, y: m, width: BED_W - 2 * m, height: BED_H - 2 * m, fill: "none", stroke: "#d8dce2", "stroke-width": 0.25, "stroke-dasharray": "1.6 1.6" }));
      if (state.output.travel && currentStrokes.length) {
        var td = "", cx = 0, cy = 0;
        currentStrokes.forEach(function (s) {
          var a = s.pts[0];
          td += "M" + fmtPt([cx, cy]) + "L" + fmtPt(a);
          var b = s.pts[s.pts.length - 1]; cx = b[0]; cy = b[1];
        });
        svg.appendChild(svgEl("path", { d: td, fill: "none", stroke: "#c3c9d1", "stroke-width": 0.22, "stroke-dasharray": "1.2 1.2" }));
      }
      var byPen = {};
      currentStrokes.forEach(function (s) { (byPen[s.pen] = byPen[s.pen] || []).push(s); });
      Object.keys(byPen).map(Number).sort(function (a, b) { return a - b; }).forEach(function (pen) {
        var d = byPen[pen].map(function (s) { return pathD(s.pts, s.closed); }).join("");
        var p = svgEl("path", { d: d, fill: "none", stroke: PENS[pen].hex, "stroke-width": PREVIEW_PEN_WIDTH, "stroke-linecap": "round", "stroke-linejoin": "round" });
        p.setAttribute("class", "pen-path");
        p.setAttribute("data-pen", pen);
        svg.appendChild(p);
      });
      var msg = el("paperMsg");
      if (msg) {
        if (!currentStrokes.length) {
          msg.textContent = "This pattern produced no paths with these settings — try a different seed or parameters.";
          msg.hidden = false;
        } else {
          msg.hidden = true;
        }
      }
    }
    function renderStats() {
      var st = currentStats;
      var box = el("statsBox");
      if (!st) { box.innerHTML = ""; return; }
      var totalSec = Math.round(st.seconds);
      var timeTxt = totalSec >= 3600 ? (Math.floor(totalSec / 3600) + "h " + String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0") + "m")
        : (Math.floor(totalSec / 60) + ":" + String(totalSec % 60).padStart(2, "0"));
      var longWarn = st.seconds > 25 * 60;
      var html = "";
      html += statHtml(st.paths, "", "Paths");
      html += statHtml((st.ink / 1000).toFixed(2), " m", "Ink length");
      html += statHtml(st.lifts, "", "Pen lifts");
      html += statHtml((st.travel / 1000).toFixed(2), " m", "Pen-up travel");
      html += "<div class=\"stat" + (longWarn ? " warn" : "") + "\"><span class=\"v\">~" + timeTxt + "</span><span class=\"k\">Est. plot time</span></div>";
      html += "<div class=\"spacer\"></div>";
      html += "<div class=\"pen-breakdown\">";
      Object.keys(st.perPen).map(Number).sort(function (a, b) { return a - b; }).forEach(function (pen) {
        html += "<span class=\"pen-tag\"><i style=\"background:" + PENS[pen].hex + "\"></i>" + PENS[pen].t + " " + (st.perPen[pen] / 1000).toFixed(2) + " m</span>";
      });
      html += "</div>";
      box.innerHTML = html;
      el("exportHint").textContent = "Estimate at " + state.output.feed + " mm/s pen-down, 200 mm/s pen-up, 0.5 s per lift — your planner will differ; treat as a rough guide." +
        (longWarn ? " Long plot: over 25 minutes at these settings." : "");
      function statHtml(v, unit, k) {
        return "<div class=\"stat\"><span class=\"v\">" + v + "<small>" + unit + "</small></span><span class=\"k\">" + k + "</span></div>";
      }
    }

    /* ---------------- SVG export ---------------- */
    function buildExportSVG() {
      var byPen = {};
      currentStrokes.forEach(function (s) { (byPen[s.pen] = byPen[s.pen] || []).push(s); });
      var st = currentStats;
      if (!st || !currentStrokes.length) return "";
      var lines = [];
      lines.push("<?xml version=\"1.0\" encoding=\"UTF-8\"?>");
      lines.push("<!-- Plotter Geometry Generator · " + currentPattern().name + " · seed " + state.seed +
        " · " + st.paths + " paths · " + (st.ink / 1000).toFixed(2) + " m ink · " + st.lifts + " lifts -->");
      lines.push("<svg xmlns=\"http://www.w3.org/2000/svg\" xmlns:inkscape=\"http://www.inkscape.org/namespaces/inkscape\" width=\"118mm\" height=\"140mm\" viewBox=\"0 0 118 140\">");
      Object.keys(byPen).map(Number).sort(function (a, b) { return a - b; }).forEach(function (pen, gi) {
        var label = (state.output.pause && gi > 0 ? "!" : "") + (pen + 1) + " " + PENS[pen].name;
        lines.push("  <g inkscape:groupmode=\"layer\" inkscape:label=\"" + label + "\" id=\"pen-" + PENS[pen].t + "\">");
        byPen[pen].forEach(function (s) {
          lines.push("    <path d=\"" + pathD(s.pts, s.closed) + "\" fill=\"none\" stroke=\"" + PENS[pen].hex + "\" stroke-width=\"" + PEN_WIDTH + "\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>");
        });
        lines.push("  </g>");
      });
      lines.push("</svg>");
      return lines.join("\n");
    }
    el("downloadBtn").addEventListener("click", function () {
      var svg = buildExportSVG();
      if (!svg) return;
      var blob = new Blob([svg], { type: "image/svg+xml" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "plotter-" + state.pattern + "-seed" + state.seed + ".svg";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    });
    el("copyBtn").addEventListener("click", function () {
      var svg = buildExportSVG();
      if (!svg) return;
      var btn = el("copyBtn");
      function done(ok) {
        btn.textContent = ok ? "Copied" : "Copy failed";
        setTimeout(function () { btn.textContent = "Copy SVG"; }, 1600);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(svg).then(function () { done(true); }, function () { done(false); });
      } else done(false);
    });

    /* ---------------- plot preview animation ---------------- */
    var anim = null;
    el("playBtn").addEventListener("click", function () {
      if (anim) { stopAnim(); return; }
      var paths = Array.prototype.slice.call(document.querySelectorAll("#preview .pen-path"));
      if (!paths.length) return;
      var totalInk = currentStats ? currentStats.ink : 0;
      if (!totalInk) return;
      var speed = 500; // mm/s simulated
      var duration = Math.max(1500, totalInk / speed * 1000);
      var lens = paths.map(function (p) {
        var L = 0;
        try { L = p.getTotalLength(); } catch (e) { L = 0; }
        return L;
      });
      var total = lens.reduce(function (a, b) { return a + b; }, 0);
      if (!total) return;
      paths.forEach(function (p, i) {
        p.style.strokeDasharray = lens[i] + " " + lens[i];
        p.style.strokeDashoffset = lens[i];
      });
      el("playBtn").textContent = "■ Stop preview";
      var t0 = performance.now();
      function frame(now) {
        var frac = Math.min(1, (now - t0) / duration);
        var target = frac * total, acc = 0;
        paths.forEach(function (p, i) {
          var local = clamp((target - acc) / (lens[i] || 1), 0, 1);
          p.style.strokeDashoffset = lens[i] * (1 - local);
          acc += lens[i];
        });
        if (frac < 1) anim = requestAnimationFrame(frame);
        else stopAnim();
      }
      anim = requestAnimationFrame(frame);
    });
    function stopAnim() {
      if (anim) cancelAnimationFrame(anim);
      anim = null;
      Array.prototype.forEach.call(document.querySelectorAll("#preview .pen-path"), function (p) {
        p.style.strokeDasharray = "none";
        p.style.strokeDashoffset = "0";
      });
      el("playBtn").textContent = "▶ Preview plot";
    }

    /* ---------------- seed controls ---------------- */
    el("seedInput").addEventListener("change", function () {
      var v = parseInt(el("seedInput").value, 10);
      if (!isNaN(v)) { state.seed = Math.abs(v); scheduleRegen(0); }
    });
    el("seedDice").addEventListener("click", function () {
      state.seed = (Math.random() * 99999) | 0;
      el("seedInput").value = state.seed;
      scheduleRegen(0);
    });

    /* ---------------- init ---------------- */
    buildPatternGrid();
    buildParams();
    buildOutput();
    buildPens();
    buildColour();
    buildDesc();
    regenerate();
    </script>
  </body>
</html>
